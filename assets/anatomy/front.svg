<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 360" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Figura muscular frontal, proporciones humanoides</title><desc id="desc">Personaje pixel art de cuerpo completo con grupos musculares seleccionables.</desc>
<rect width="220" height="360" fill="#111c23"/>
<g stroke="#081117" stroke-width="2.4" stroke-linejoin="miter">
<!-- cráneo, cuello y rostro -->
<g data-muscle="masseter" class="muscle-hotspot" tabindex="0" role="button" aria-label="Masetero">
<path fill="#d9a477" d="M87 19h46v7h7v39h-6v13h-8v7H94v-7h-8V65h-6V26h7z"/>
<path fill="#f2c99b" d="M91 25h39v7H91zM87 34h5v24h-5z"/>
<path fill="#17232c" d="M93 43h9v5h-9zM119 43h9v5h-9z"/>
<path fill="#6c4033" d="M105 55h14v4h-14zM109 60h7v3h-7z"/>
<path fill="#bd8463" d="M90 65h6v8h-6zM126 65h6v8h-6z"/>
</g>
<path fill="#d9a477" d="M96 84h28v17H96z"/><path fill="#f2c99b" d="M100 85h7v12h-7z"/>
<!-- clavículas, torso -->
<path fill="#d9a477" d="M86 98h48l15 10-8 19-8 30-5 31H92l-5-31-8-30-8-19z"/>
<g data-muscle="pectoralis" class="muscle-hotspot" tabindex="0" role="button" aria-label="Pectoral mayor">
<path fill="#d85e57" d="M88 103h19l3 7 3-7h19l9 9-5 17-20 2-6-5-6 5-20-2-5-17z"/>
<path fill="#f08b69" d="M88 108h18v5H88zM114 108h18v5h-18zM91 116h14v8H91zM115 116h14v8h-14z"/>
</g>
<g data-muscle="rectus" class="muscle-hotspot" tabindex="0" role="button" aria-label="Recto abdominal">
<path fill="#bd4f4d" d="M102 130h16v35h-16z"/><path fill="#f08b69" d="M104 132h5v8h-5zM112 132h4v8h-4zM104 143h5v8h-5zM112 143h4v8h-4zM104 154h5v8h-5zM112 154h4v8h-4z"/>
</g>
<g data-muscle="obliques" class="muscle-hotspot" tabindex="0" role="button" aria-label="Oblicuos">
<path fill="#c95150" d="M86 130h13l3 24-6 16-7-5-5-17zM121 130h13l2 18-5 17-7 5-6-16z"/>
</g>
<!-- brazos anatómicos: hombro, brazo, antebrazo y manos -->
<g data-muscle="deltoid" class="muscle-hotspot" tabindex="0" role="button" aria-label="Deltoides">
<path fill="#e6b184" d="M72 105l13-7 9 8-3 18-11 7-9-8zM135 98l13 7 1 18-9 8-11-7-3-18z"/>
</g>
<g data-muscle="biceps" class="muscle-hotspot" tabindex="0" role="button" aria-label="Bíceps braquial">
<path fill="#c95150" d="M73 126l12 3-1 22-7 8-6-7zM135 129l12-3 2 26-6 7-7-8z"/><path fill="#f07878" d="M77 132h4v15h-4zM139 132h4v15h-4z"/>
</g>
<g data-muscle="forearm" class="muscle-hotspot" tabindex="0" role="button" aria-label="Músculos del antebrazo">
<path fill="#d9a477" d="M72 157l11 2-4 31-6 8-6-4 2-18zM137 159l11-2 3 19 2 18-6 4-6-8z"/>
<path fill="#f2c99b" d="M69 190h7v8h-7zM145 190h7v8h-7z"/>
</g>
<!-- pelvis -->
<path fill="#d9a477" d="M91 169h38l10 15-9 17-8 6h-24l-8-6-9-17z"/>
<path fill="#f2c99b" d="M92 174h7v17h-7z"/>
<!-- piernas separadas, muslos -->
<g data-muscle="quadriceps" class="muscle-hotspot" tabindex="0" role="button" aria-label="Cuádriceps">
<path fill="#4ca58b" d="M91 202h18l-1 31-4 18-1 19H87l1-22-4-22zM111 202h18l7 24-4 22 1 22h-16l-1-19-4-18z"/>
<path fill="#78d4a4" d="M91 210h6v26h-6zM118 210h6v26h-6z"/>
</g>
<!-- tibias y pantorrillas -->
<g data-muscle="tibialis" class="muscle-hotspot" tabindex="0" role="button" aria-label="Tibial anterior">
<path fill="#3b947f" d="M88 268h16l-1 34-5 21H84l3-21zM116 268h16l2 34 3 21h-14l-5-21z"/>
<path fill="#78d4a4" d="M91 273h4v26h-4zM120 273h4v26h-4z"/>
</g>
<g data-muscle="calves" class="muscle-hotspot" tabindex="0" role="button" aria-label="Gastrocnemio y sóleo">
<path fill="#4ca58b" d="M105 271h8v29h-8z"/>
</g>
<!-- pies -->
<path fill="#d9a477" d="M84 323h14v7h7v8H73v-7h11zM124 323h14v7h11v8h-32v-8h7z"/>
<path fill="#f2c99b" d="M77 332h25v4H77zM119 332h25v4h-25z"/>
<!-- línea de simetría discreta -->
<path d="M110 91v78M110 204v115" stroke="#0b141a" stroke-width="1" fill="none"/>
</g></svg>